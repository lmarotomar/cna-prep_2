<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador en Proceso | CNA ProMaster</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="exam-layout">
    <!-- Exam Navigation Bar -->
    <nav class="exam-nav">
        <div class="exam-info">
            <span id="battery-name" style="font-weight: bold;">Cargando...</span>
        </div>
        <div class="exam-timer" id="timer">00:00:00</div>
        <div class="exam-exit" onclick="confirmExit()">Salir (Terminar)</div>
    </nav>

    <!-- Progress Indicator -->
    <div class="exam-progress-container">
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.5rem;">
            <span id="progress-text">Pregunta 1 de 60</span>
            <span id="percentage-text">0% Completado</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
    </div>

    <!-- Main Question Area -->
    <main class="exam-main fade-in" id="exam-main">
        <div id="question-container">
            <div class="question-text" id="question-text">
                Prepare to begin the examination.
            </div>
            <div class="options-list" id="options-list">
                <!-- Options will be injected here -->
            </div>
        </div>

        <!-- Results View (Hidden by default) -->
        <div id="results-view" style="display: none;" class="results-card">
            <h1 id="results-title">Resultado de la Batería</h1>
            <div class="score-circle" id="score-circle">
                <span class="score-value" id="score-value">0%</span>
                <span class="score-label">Global Score</span>
            </div>
            <div id="results-details" style="margin-bottom: 2rem;">
                Preguntas Correctas: <span id="correct-count">0</span> / <span id="total-count">60</span>
            </div>

            <div id="review-area" style="display: none;">
                <h3 style="margin-top: 2rem; border-top: 2px solid #e2e8f0; padding-top: 2rem;">Revisión de Errores /
                    Incorrect Questions Review</h3>
                <div id="review-container" class="review-container">
                    <!-- Failed questions review will be injected here -->
                </div>
            </div>

            <div id="pass-fail-msg" style="font-weight: 800; font-size: 1.5rem; margin-bottom: 2rem;"></div>
            <button class="btn btn-primary" onclick="window.location.href='index.html'">Volver al Inicio</button>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="exam-footer">
        <button class="btn btn-outline" id="prev-btn" onclick="prevQuestion()" disabled>Anterior</button>
        <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Siguiente</button>
    </footer>

    <script src="js/questions.js"></script>
    <script src="js/app.js"></script>
    <script>
        function confirmExit() {
            if (confirm("¿Estás seguro de que quieres salir? Tu progreso no se guardará hasta completar el examen.")) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>

</html>
