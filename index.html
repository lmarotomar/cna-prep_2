<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNA ProMaster — Access</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(135deg, #0f766e 0%, #1e40af 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: white;
  border-radius: 20px;
  padding: 48px 40px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 25px 50px rgba(0,0,0,0.25);
  text-align: center;
}
.logo { font-size: 42px; margin-bottom: 12px; }
h1 {
  font-size: 26px;
  font-weight: 800;
  color: #1e293b;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 14px;
  color: #64748b;
  margin-bottom: 32px;
  font-style: italic;
}
label {
  display: block;
  text-align: left;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 8px;
}
input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  font-size: 15px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: 'Courier New', monospace;
  font-weight: 700;
  color: #1e293b;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
}
input:focus { border-color: #0f766e; }
input.error { border-color: #ef4444; background: #fef2f2; }
input.success { border-color: #10b981; background: #f0fdf4; }
.error-msg {
  color: #ef4444;
  font-size: 13px;
  margin-top: 8px;
  display: none;
}
.btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #0f766e, #0d9488);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 20px;
  transition: opacity 0.2s, transform 0.1s;
  font-family: inherit;
}
.btn:hover { opacity: 0.92; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.footer {
  margin-top: 24px;
  font-size: 11px;
  color: #94a3b8;
  line-height: 1.6;
}
.spinner {
  display: none;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏥</div>
  <h1>CNA ProMaster</h1>
  <p class="subtitle">Practice App · App de Práctica</p>

  <label for="code">Enter your access code / Ingresa tu código de acceso</label>
  <input
    type="text"
    id="code"
    placeholder="CNA-XXXXX-XXXXX"
    maxlength="15"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="characters"
    spellcheck="false"
  />
  <div class="error-msg" id="error-msg"></div>

  <button class="btn" onclick="verify()" id="btn">
    Access App / Acceder a la App →
  </button>

  <div class="footer">
    Your access code was delivered to your email after purchase.<br>
    Tu código fue enviado a tu correo después de la compra.<br><br>
    Need help? · ¿Necesitas ayuda?<br>
    <strong>lmarotomar@mardigitalhub.com</strong>
  </div>
</div>

<script>
const WEBHOOK_URL = 'https://mardigital.app.n8n.cloud/webhook/cna-access';

// Pre-built spinner node — avoids runtime innerHTML manipulation
const _spinnerNode = document.createElement('div');
_spinnerNode.className = 'spinner';
_spinnerNode.style.display = 'block';

function setBtnLoading(btn) {
  while (btn.firstChild) btn.removeChild(btn.firstChild);
  btn.appendChild(_spinnerNode);
  btn.disabled = true;
}

function setBtnText(btn, text) {
  while (btn.firstChild) btn.removeChild(btn.firstChild);
  btn.appendChild(document.createTextNode(text));
  btn.disabled = false;
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

document.getElementById('code').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') verify();
});

document.getElementById('code').addEventListener('input', function(e) {
  e.target.classList.remove('error', 'success');
  document.getElementById('error-msg').style.display = 'none';
  // Auto-format: add dashes
  var v = e.target.value.replace(/[^A-Z0-9]/gi, '').toUpperCase();
  if (v.length > 3) v = v.slice(0, 3) + '-' + v.slice(3);
  if (v.length > 9) v = v.slice(0, 9) + '-' + v.slice(9);
  e.target.value = v.slice(0, 15);
});

async function verify() {
  var code = document.getElementById('code').value.trim().toUpperCase();
  var btn = document.getElementById('btn');
  var codeEl = document.getElementById('code');

  setBtnLoading(btn);
  codeEl.classList.remove('error', 'success');
  document.getElementById('error-msg').style.display = 'none';

  var payload = {
    code: code,
    userAgent: navigator.userAgent,
    language: navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screenWidth: window.screen.width,
    screenHeight: window.screen.height,
    timestamp: new Date().toISOString()
  };

  var data;
  try {
    var res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    data = await res.json();
  } catch (_) {
    showError('⚠️ We could not verify your code right now. Please try again or contact support. / No pudimos verificar tu código. Intenta de nuevo o contacta soporte.');
    setBtnText(btn, 'Access App / Acceder a la App →');
    return;
  }

  if (data.allowed === true) {
    codeEl.classList.add('success');
    sessionStorage.setItem('cna_access', '1');
    sessionStorage.setItem('cna_code', code);
    setBtnText(btn, '✓ Access Granted — Loading...');
    btn.disabled = true;
    setTimeout(function() { window.location.href = './app.html'; }, 800);
    return;
  }

  codeEl.classList.add('error');
  setBtnText(btn, 'Access App / Acceder a la App →');

  var status = (data && data.status) ? data.status : 'error';
  if (status === 'blocked') {
    showError('🚫 This code has been blocked. Contact support. / Este código fue bloqueado. Contacta soporte.');
  } else if (status === 'invalid') {
    showError('❌ Invalid code. Please check and try again. / Código inválido. Verifica e intenta de nuevo.');
  } else {
    showError('⚠️ We could not verify your code right now. Please try again or contact support. / Contacta soporte.');
  }
}

// If already verified this session, skip gate
if (sessionStorage.getItem('cna_access') === '1') {
  window.location.href = './app.html';
}
</script>
</body>
</html>
