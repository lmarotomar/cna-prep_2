<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNA Exam ProMaster | Professional Simulator</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
if (sessionStorage.getItem("cna_access") !== "1") {
  window.location.href = "./index.html";
}
</script>
</head>

<body>
    <div class="container fade-in">
        <header>
            <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;" id="lang-selector-container"></div>
            <h1 class="title-main">CNA Exam <span style="color: var(--primary)">ProMaster</span></h1>
            <p class="subtitle" data-en="ProMetric Certification Simulator - Difficulty Level: Expert" data-es="Simulador de Certificación ProMetric - Nivel de Dificultad: Experto"></p>
        </header>

        <section class="info-band"
            style="background: #eff6ff; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; border: 1px solid #dbeafe;">
            <p>
                <strong id="info-label"></strong><span id="info-goal"></span><br>
                <span id="info-questions"></span>
            </p>
        </section>

        <div class="battery-grid" id="battery-list">
            <div class="battery-card" onclick="startExam(0)">
                <div class="battery-icon">🏥</div>
                <h3 data-en="Mixed Exam 1" data-es="Simulacro Mixto 1"></h3>
                <p data-en="General assessment: Hygiene, safety, and vital signs." data-es="Evaluación general: Higiene, seguridad y signos vitales."></p>
                <div class="battery-stats">
                    <span data-en="60 Questions" data-es="60 Preguntas"></span>
                    <span id="score-0">--%</span>
                </div>
            </div>

            <div class="battery-card" onclick="startExam(1)">
                <div class="battery-icon">🫀</div>
                <h3 data-en="Mixed Exam 2" data-es="Simulacro Mixto 2"></h3>
                <p data-en="Varied content: Emergencies, infections, and ethics." data-es="Contenido variado: Emergencias, infecciones y ética."></p>
                <div class="battery-stats">
                    <span data-en="60 Questions" data-es="60 Preguntas"></span>
                    <span id="score-1">--%</span>
                </div>
            </div>

            <div class="battery-card" onclick="startExam(2)">
                <div class="battery-icon">👵</div>
                <h3 data-en="Mixed Exam 3" data-es="Simulacro Mixto 3"></h3>
                <p data-en="Comprehensive review: Geriatrics, mobility, and residents' rights." data-es="Repaso integral: Geriatría, movilidad y derechos."></p>
                <div class="battery-stats">
                    <span data-en="60 Questions" data-es="60 Preguntas"></span>
                    <span id="score-2">--%</span>
                </div>
            </div>

            <div class="battery-card" onclick="startExam(3)">
                <div class="battery-icon">🧘</div>
                <h3 data-en="Mixed Exam 4" data-es="Simulacro Mixto 4"></h3>
                <p data-en="Mixed topics: Mental health, nutrition, and regulations." data-es="Mezcla de temas: Salud mental, nutrición y leyes."></p>
                <div class="battery-stats">
                    <span data-en="60 Questions" data-es="60 Preguntas"></span>
                    <span id="score-3">--%</span>
                </div>
            </div>

            <div class="battery-card" onclick="startExam(4)">
                <div class="battery-icon">📜</div>
                <h3 data-en="Mixed Exam 5" data-es="Simulacro Mixto 5"></h3>
                <p data-en="Cross evaluation: Legal protocols and basic care." data-es="Evaluación cruzada: Protocolos legales y cuidados básicos."></p>
                <div class="battery-stats">
                    <span data-en="60 Questions" data-es="60 Preguntas"></span>
                    <span id="score-4">--%</span>
                </div>
            </div>

            <div class="battery-card" onclick="startExam(5)">
                <div class="battery-icon">🎓</div>
                <h3 data-en="Mixed Exam 6 (Final)" data-es="Simulacro Mixto 6 (Final)"></h3>
                <p data-en="Full review exam covering all ProMetric domains." data-es="Examen de repaso total con todos los dominios ProMetric."></p>
                <div class="battery-stats">
                    <span data-en="60 Questions" data-es="60 Preguntas"></span>
                    <span id="score-5">--%</span>
                </div>
            </div>

            <div class="battery-card" onclick="startExam(6)" style="border: 2px solid var(--primary);">
                <div class="battery-icon">🎯</div>
                <h3 data-en="Strategic Exam 7" data-es="Simulacro Estratégico 7"></h3>
                <p data-en="Critical NNAAP areas: Restorative Care and Health Team." data-es="Áreas críticas NNAAP: Cuidado Restaurativo y Equipo de Salud."></p>
                <div class="battery-stats">
                    <span data-en="20 Questions" data-es="20 Preguntas"></span>
                    <span id="score-6">--%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = localStorage.getItem('cna_lang') || 'en';

        const infoBandContent = {
            en: { label: 'Goal: ', goal: '80% or higher to pass (ProMetric Style).', questions: '416 bilingual questions across 7 exams — 6 mixed + 1 strategic NNAAP.' },
            es: { label: 'Meta: ', goal: '80% o más para aprobar (Estilo ProMetric).', questions: '416 preguntas bilingües distribuidas en 7 simulacros — 6 mixtos + 1 estratégico NNAAP.' },
            bi: { label: 'Goal / Meta: ', goal: '80% or higher / 80% o más para aprobar (ProMetric).', questions: '416 bilingual questions / preguntas bilingües — 6 mixed + 1 strategic NNAAP.' }
        };

        function startExam(id) {
            localStorage.setItem('selectedBattery', id);
            window.location.href = 'exam.html';
        }

        function setupLangSelector() {
            const container = document.getElementById('lang-selector-container');
            container.textContent = '';
            const langs = [
                { id: 'en', label: 'EN' },
                { id: 'es', label: 'ES' },
                { id: 'bi', label: 'Bi' }
            ];
            langs.forEach(l => {
                const btn = document.createElement('button');
                btn.textContent = l.label;
                btn.className = 'btn btn-sm ' + (currentLang === l.id ? 'btn-primary' : 'btn-outline');
                btn.style.cssText = 'padding: 4px 12px; font-size: 0.8rem; margin-left: 5px;';
                if (currentLang === l.id) {
                    btn.style.background = 'var(--primary)';
                    btn.style.color = 'white';
                }
                btn.onclick = () => {
                    currentLang = l.id;
                    localStorage.setItem('cna_lang', l.id);
                    setupLangSelector();
                    updateUIStrings();
                };
                container.appendChild(btn);
            });
        }

        function updateUIStrings() {
            const lang = currentLang === 'bi' ? 'bi' : currentLang;
            const dataLang = currentLang === 'bi' ? 'en' : currentLang;

            // Update all bilingual data-en / data-es elements
            document.querySelectorAll('[data-en]').forEach(el => {
                el.textContent = dataLang === 'es' ? el.dataset.es : el.dataset.en;
            });

            // Info band — safe DOM text nodes only
            const band = infoBandContent[lang] || infoBandContent.en;
            document.getElementById('info-label').textContent = band.label;
            document.getElementById('info-goal').textContent = band.goal;
            document.getElementById('info-questions').textContent = band.questions;
        }

        window.onload = () => {
            setupLangSelector();
            updateUIStrings();
            const scores = JSON.parse(localStorage.getItem('cna_scores') || '{}');
            Object.keys(scores).forEach(id => {
                const el = document.getElementById('score-' + id);
                if (el) el.textContent = scores[id] + '%';
            });
        };
    </script>
</body>

</html>
